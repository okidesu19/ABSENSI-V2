<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <!-- Modern Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f7fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.3)" />
    </linearGradient>
    
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.08"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#6366f1" opacity="0.08"/>
    </pattern>
    
    <pattern id="linePattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0,50 Q 50,0 100,50" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Card Base -->
  <rect x="30" y="30" width="840" height="500" rx="24" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <rect x="30" y="30" width="840" height="500" rx="24" fill="url(#dotPattern)"/>
  <rect x="30" y="30" width="840" height="500" rx="24" fill="url(#linePattern)"/>
  
  <!-- Glass Header -->
  <rect x="30" y="30" width="840" height="100" rx="24" fill="url(#accentGrad)"/>
  <rect x="30" y="80" width="840" height="50" fill="url(#accentGrad)"/>
  
  <!-- Abstract Shapes -->
  <circle cx="800" cy="80" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="750" cy="60" r="30" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Logo & Brand -->
  <g transform="translate(70, 80)">
    <circle r="28" fill="white" opacity="0.95"/>
    <path d="M -12,-8 L 0,-20 L 12,-8 L 8,-4 L 0,-12 L -8,-4 Z" fill="#6366f1"/>
    <path d="M -12,8 L 0,20 L 12,8 L 8,4 L 0,12 L -8,4 Z" fill="#8b5cf6"/>
    <circle r="6" fill="#6366f1"/>
  </g>
  
  <!-- Header Text -->
  <text x="115" y="75" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">SMKN 1 SDK</text>
  <text x="115" y="98" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="3">KARTU PELAJAR DIGITAL</text>
  
  <!-- Holographic Strip -->
  <rect x="820" y="30" width="50" height="500" rx="0" fill="url(#holoGrad)"/>
  <text x="845" y="280" font-family="'Inter', monospace" font-size="10" fill="rgba(0,0,0,0.2)" text-anchor="middle" transform="rotate(90, 845, 280)" letter-spacing="4">SECURE ID 2026</text>
  
  <!-- Main Content Grid -->
  <g transform="translate(70, 160)">
    
    <!-- Photo Section -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="200" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Photo Placeholder with Modern Icon -->
      <g transform="translate(80, 85)" opacity="0.15">
        <circle r="45" fill="#6366f1"/>
        <circle r="38" fill="#f8fafc"/>
        <path d="M -20,10 Q 0,-10 20,10 L 20,25 Q 0,35 -20,25 Z" fill="#6366f1"/>
        <circle cy="-15" r="18" fill="#6366f1"/>
      </g>
      
      <!-- Photo Badge -->
      <g transform="translate(80, 175)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="url(#accentGrad)"/>
        <text x="0" y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">PAS FOTO</text>
      </g>
      
      <!-- Corner Accent -->
      <circle cx="150" cy="10" r="4" fill="#10b981"/>
    </g>
    
    <!-- Data Section -->
    <g transform="translate(190, 0)">
      
      <!-- NIS -->
      <g>
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">NIS</text>
        <text x="0" y="28" font-family="'SF Mono', 'Fira Code', monospace" font-size="20" font-weight="600" fill="#1e293b" letter-spacing="2">2024.001.1234</text>
        <rect x="0" y="38" width="420" height="2" rx="1" fill="#e2e8f0"/>
      </g>
      
      <!-- Nama -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">NAMA LENGKAP</text>
        <text x="0" y="32" font-family="'Inter', sans-serif" font-size="26" font-weight="700" fill="#0f172a" letter-spacing="-0.5">BUDI SANTOSO</text>
        <rect x="0" y="42" width="420" height="2" rx="1" fill="#e2e8f0"/>
      </g>
      
      <!-- Grid: Kelas & Jurusan -->
      <g transform="translate(0, 120)">
        <g>
          <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">KELAS</text>
          <text x="0" y="28" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#1e293b">XII TJKT 1</text>
          <rect x="0" y="36" width="190" height="2" rx="1" fill="#e2e8f0"/>
        </g>
        <g transform="translate(230, 0)">
          <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">JURUSAN</text>
          <text x="0" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#1e293b">Teknik Jaringan</text>
          <rect x="0" y="36" width="190" height="2" rx="1" fill="#e2e8f0"/>
        </g>
      </g>
      
      <!-- TTL -->
      <g transform="translate(0, 190)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">TEMPAT, TANGGAL LAHIR</text>
        <text x="0" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#334155">Jakarta, 15 Juni 2007</text>
        <rect x="0" y="36" width="420" height="2" rx="1" fill="#e2e8f0"/>
      </g>
      
      <!-- Face ID Status -->
      <g transform="translate(0, 250)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">STATUS BIOMETRIK</text>
        <g transform="translate(0, 12)">
          <rect x="0" y="0" width="160" height="36" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="20" cy="18" r="8" fill="#10b981"/>
          <path d="M 16,18 L 19,21 L 24,15" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="38" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#059669">TERVERIFIKASI</text>
        </g>
      </g>
      
      <!-- Alamat -->
      <g transform="translate(0, 310)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#6366f1" letter-spacing="1">ALAMAT</text>
        <text x="0" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#475569">Jl. Pendidikan No. 123, Kec. Taman, Sidoarjo</text>
      </g>
    </g>
    
    <!-- QR Section -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="140" height="200" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- QR Code Modern -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="100" height="100" rx="8" fill="white"/>
        <g transform="translate(10, 10)">
          <!-- QR Pattern -->
          <g fill="#1e293b">
            <!-- Position Markers -->
            <rect x="0" y="0" width="24" height="24" rx="4"/>
            <rect x="2" y="2" width="20" height="20" rx="2" fill="white"/>
            <rect x="6" y="6" width="12" height="12" rx="2"/>
            
            <rect x="56" y="0" width="24" height="24" rx="4"/>
            <rect x="58" y="2" width="20" height="20" rx="2" fill="white"/>
            <rect x="62" y="6" width="12" height="12" rx="2"/>
            
            <rect x="0" y="56" width="24" height="24" rx="4"/>
            <rect x="2" y="58" width="20" height="20" rx="2" fill="white"/>
            <rect x="6" y="62" width="12" height="12" rx="2"/>
            
            <!-- Data -->
            <rect x="30" y="6" width="6" height="6" rx="1"/>
            <rect x="42" y="6" width="6" height="6" rx="1"/>
            <rect x="30" y="18" width="6" height="6" rx="1"/>
            <rect x="36" y="30" width="6" height="6" rx="1"/>
            <rect x="48" y="30" width="6" height="6" rx="1"/>
            <rect x="30" y="42" width="6" height="6" rx="1"/>
            <rect x="42" y="42" width="6" height="6" rx="1"/>
            
            <rect x="6" y="30" width="6" height="6" rx="1"/>
            <rect x="18" y="36" width="6" height="6" rx="1"/>
            <rect x="62" y="30" width="6" height="6" rx="1"/>
            <rect x="74" y="36" width="6" height="6" rx="1"/>
            
            <rect x="30" y="62" width="6" height="6" rx="1"/>
            <rect x="42" y="68" width="6" height="6" rx="1"/>
            <rect x="54" y="62" width="6" height="6" rx="1"/>
            <rect x="66" y="68" width="6" height="6" rx="1"/>
            <rect x="78" y="62" width="6" height="6" rx="1"/>
          </g>
        </g>
        
        <!-- Corner Accents -->
        <path d="M 0,0 L 15,0 L 0,15 Z" fill="url(#accentGrad)" opacity="0.2"/>
        <path d="M 100,0 L 85,0 L 100,15 Z" fill="url(#accentGrad)" opacity="0.2"/>
        <path d="M 0,100 L 15,100 L 0,85 Z" fill="url(#accentGrad)" opacity="0.2"/>
        <path d="M 100,100 L 85,100 L 100,85 Z" fill="url(#accentGrad)" opacity="0.2"/>
      </g>
      
      <!-- Scan Label -->
      <g transform="translate(70, 145)">
        <rect x="-55" y="0" width="110" height="28" rx="14" fill="url(#accentGrad)"/>
        <text x="0" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">SCAN ABSENSI</text>
      </g>
      
      <!-- ID Number -->
      <text x="70" y="190" font-family="'SF Mono', monospace" font-size="9" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">ID: 8812-9945-6621</text>
    </g>
  </g>
  
  <!-- Signature Section -->
  <g transform="translate(70, 380)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 20,40 Q 40,20 60,35 T 100,30 T 140,35" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
    <text x="80" y="55" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">Tanda Tangan Digital</text>
  </g>
  
  <!-- Footer -->
  <g transform="translate(450, 490)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="2">KARTU INI ADALAH MILIK SMKN 1 SDK • BERLAKU SELAMA MENJADI SISWA</text>
  </g>
  
  <!-- NFC/Chip Icon -->
  <g transform="translate(820, 420)">
    <rect x="0" y="0" width="36" height="28" rx="6" fill="url(#accentGrad)" opacity="0.9"/>
    <path d="M 8,14 Q 12,6 18,14 Q 24,22 28,14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="18" cy="14" r="3" fill="white"/>
  </g>
  
  <!-- Security Watermark -->
  <g opacity="0.03" transform="rotate(-30, 450, 280)">
    <text x="450" y="280" font-family="'Inter', sans-serif" font-size="120" font-weight="900" fill="#6366f1" text-anchor="middle">SMKN1</text>
  </g>
</svg>